name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-only-secret-not-used-for-anything-real"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply schema
        run: npx prisma db push --skip-generate

      - name: Seed (verifies the demo dataset still loads)
        run: npm run db:seed

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lumina-lms:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
