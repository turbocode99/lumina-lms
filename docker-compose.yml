# ---------------------------------------------------------------------------
# Lumina LMS — Docker Compose
#
# Easiest path: run ./deploy.sh from the repo root. It generates .env.docker
# with a random AUTH_SECRET, then wraps the commands below with the right flags
# and env file, and waits for the health check. See README.md for the one-line
# version and the recommended host OS.
#
# Calling compose directly:
#
#   Default (SQLite, zero config beyond a secret):
#     docker compose --env-file .env.docker up -d --build
#
#   With PostgreSQL (for multi-instance or larger deployments):
#     1. Set `provider = "postgresql"` in prisma/schema.prisma
#     2. docker compose --env-file .env.docker --profile postgres up -d --build
#
#   With automatic HTTPS via a public domain (Caddy + Let's Encrypt):
#     1. Point DNS for the domain at this host; open ports 80 and 443.
#     2. Set DOMAIN=lms.example.com in .env.docker
#     3. docker compose --env-file .env.docker --profile proxy up -d --build
#     The app's own port stays published for direct/internal access too — if you
#     want HTTPS to be the only way in, firewall HOST_PORT from outside traffic
#     (e.g. `ufw deny <port>`) or bind it to 127.0.0.1 in the ports line below.
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Also passed as build args, because NEXT_PUBLIC_* is baked into the client
      # bundle at build time; the `environment:` block below only reaches code
      # rendered on the server.
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Lumina}
        NEXT_PUBLIC_APP_TAGLINE: ${NEXT_PUBLIC_APP_TAGLINE:-Learning, elevated.}
        NEXT_PUBLIC_ORG_NAME: ${NEXT_PUBLIC_ORG_NAME:-Your Organization}
    image: lumina-lms:latest
    container_name: lumina-lms
    restart: unless-stopped
    ports:
      # host:container. The container port is fixed at 4400 (see Dockerfile);
      # HOST_PORT changes only what you browse to.
      - "${HOST_PORT:-4400}:4400"
    environment:
      # SQLite lives on the `data` volume so it survives container replacement.
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/lumina.db}

      # REQUIRED. Generate with: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set — generate one with `openssl rand -base64 32`}

      AUTH_SESSION_MAX_AGE: ${AUTH_SESSION_MAX_AGE:-604800}
      AUTH_ALLOW_SELF_REGISTRATION: ${AUTH_ALLOW_SELF_REGISTRATION:-true}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-}

      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/storage
      STORAGE_MAX_UPLOAD_MB: ${STORAGE_MAX_UPLOAD_MB:-512}

      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Lumina}
      NEXT_PUBLIC_APP_TAGLINE: ${NEXT_PUBLIC_APP_TAGLINE:-Learning, elevated.}
      NEXT_PUBLIC_ORG_NAME: ${NEXT_PUBLIC_ORG_NAME:-Your Organization}

      SEED_ON_START: ${SEED_ON_START:-false}
      NODE_ENV: production
    volumes:
      - lumina-data:/app/data
      - lumina-storage:/app/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4400/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Optional PostgreSQL. Only started with `--profile postgres`.
  postgres:
    image: postgres:17-alpine
    container_name: lumina-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-lumina}
    volumes:
      - lumina-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumina}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional reverse proxy with automatic Let's Encrypt HTTPS. Only started with
  # `--profile proxy` (deploy.sh does this automatically when given --domain).
  caddy:
    image: caddy:2-alpine
    container_name: lumina-caddy
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddy substitutes {$DOMAIN} in the Caddyfile from this at startup.
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.docker to use the proxy profile, e.g. lms.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - lumina-caddy-data:/data
      - lumina-caddy-config:/config
    depends_on:
      - app

volumes:
  lumina-data:
  lumina-storage:
  lumina-postgres:
  lumina-caddy-data:
  lumina-caddy-config:
